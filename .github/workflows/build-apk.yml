name: Rasta Studio SDK Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== SDKMANAGER ====="
          which sdkmanager
          sdkmanager --version

          echo "===== LICENSES ====="
          yes | sdkmanager --licenses || true

          echo "===== INSTALL ====="
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify SDK
        run: |
          set -eux

          echo "================================"
          echo "ANDROID SDK CHECK"
          echo "================================"

          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDKMANAGER:"
          sdkmanager --version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "PLATFORM:"
          test -d "$ANDROID_HOME/platforms/android-35"
          ls -ld "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "BUILD TOOLS:"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

          echo ""
          echo "AAPT:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

          echo ""
          echo "APKSIGNER:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

          echo ""
          echo "================================"
          echo "ANDROID SDK = OK"
          echo "================================"
