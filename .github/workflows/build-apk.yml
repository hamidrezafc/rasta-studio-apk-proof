name: Rasta Studio APK Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android Toolchain
        run: |
          set -eux

          echo "===== SDK ====="
          echo "$ANDROID_HOME"

          echo "===== ADB ====="
          adb version

          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "===== BUILD TOOLS ====="
          ls -lah "$BT"

          echo "===== AIDL ====="
          test -f "$BT/aidl"
          "$BT/aidl" --version

          echo "===== AAPT ====="
          test -f "$BT/aapt"
          "$BT/aapt" version

          echo "===== APKSIGNER ====="
          test -f "$BT/apksigner"
          "$BT/apksigner" version

          echo "===== ZIPALIGN ====="
          test -f "$BT/zipalign"

          echo "===== ANDROID PLATFORM ====="
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          echo "===== ANDROID TOOLCHAIN OK ====="

      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.36

      - name: Verify Python Environment
        run: |
          set -eux

          python --version
          python -m pip --version
          buildozer --version
          cython --version

      - name: Verify Project
        run: |
          set -eux

          test -f main.py
          test -f buildozer.spec

          echo "===== MAIN.PY ====="
          cat main.py

          echo "===== BUILDOZER.SPEC ====="
          cat buildozer.spec

      - name: Build APK
        run: |
          set -eux

          buildozer android debug

      - name: Verify APK
        run: |
          set -eux

          echo "===== APK FILES ====="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          test -n "$APK"

          echo "APK CREATED:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasta-studio-apk-proof
          path: bin/*.apk
          if-no-files-found: error
