name: Rasta Studio Build Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:

      # 1. بررسی سیستم
      - name: 01 - System Check
        run: |
          set -eux

          echo "===== OS ====="
          cat /etc/os-release

          echo "===== CPU ====="
          uname -a

          echo "===== DISK ====="
          df -h

      # 2. دریافت پروژه
      - name: 02 - Checkout
        uses: actions/checkout@v4

      # 3. بررسی فایل‌های پروژه
      - name: 03 - Project Files Check
        run: |
          set -eux

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort

          echo "===== main.py ====="
          test -f main.py
          sed -n '1,200p' main.py

          echo "===== buildozer.spec ====="
          test -f buildozer.spec
          sed -n '1,240p' buildozer.spec

      # 4. Java
      - name: 04 - Java 17 Check
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 05 - Verify Java
        run: |
          set -eux

          echo "===== JAVA ====="
          java -version

          echo "===== JAVAC ====="
          javac -version

          echo "===== JAVA_HOME ====="
          echo "$JAVA_HOME"

      # 5. Python
      - name: 06 - Python 3.11 Check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 07 - Verify Python
        run: |
          set -eux

          python --version
          python -m pip --version

      # 6. Android SDK
      - name: 08 - Android SDK Setup
        uses: android-actions/setup-android@v3

      - name: 09 - Android SDK Environment
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== SDK DIRECTORY ====="
          ls -lah "$ANDROID_HOME"

          echo "===== SDKMANAGER ====="
          which sdkmanager
          sdkmanager --version

      # 7. Licenses
      - name: 10 - Android License Check
        run: |
          set -eux

          echo "===== ACCEPTING LICENSES ====="

          yes | sdkmanager --licenses || true

          echo "===== LICENSE FILES ====="

          find "$ANDROID_HOME/licenses" -type f -maxdepth 1 -print 2>/dev/null || true

      # 8. Android packages
      - name: 11 - Install Android Packages
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      # 9. بررسی واقعی SDK
      - name: 12 - Verify Android Packages
        run: |
          set -eux

          echo "===== ADB ====="
          adb version

          echo "===== PLATFORM ====="
          ls -lah "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          echo "===== BUILD TOOLS ====="
          ls -lah "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      # 10. بررسی AIDL
      - name: 13 - AIDL Diagnostic
        run: |
          set -eux

          echo "===== SEARCHING FOR AIDL ====="

          find "$ANDROID_HOME" \
            -type f \
            -name "aidl" \
            -print

          echo "===== EXPECTED AIDL ====="

          AIDL="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo ""
            echo "===================================="
            echo "AIDL NOT FOUND"
            echo "===================================="
            exit 1
          fi

          echo ""
          echo "===================================="
          echo "AIDL FOUND"
          echo "===================================="

          "$AIDL" --version

      # 11. Build Tools binaries
      - name: 14 - Android Build Tools Diagnostic
        run: |
          set -eux

          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "===== BUILD TOOLS BINARIES ====="

          for FILE in \
            aapt \
            aapt2 \
            aidl \
            zipalign \
            apksigner
          do
            echo ""
            echo "Checking $FILE ..."

            if [ -f "$BT/$FILE" ]; then
              echo "FOUND: $BT/$FILE"
            else
              echo "MISSING: $BT/$FILE"
              exit 1
            fi
          done

      # 12. System dependencies
      - name: 15 - Install Linux Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 13. Buildozer installation
      - name: 16 - Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.36

      # 14. Buildozer diagnostic
      - name: 17 - Buildozer Check
        run: |
          set -eux

          echo "===== BUILDOZER ====="

          which buildozer
          buildozer --version

          echo "===== CYTHON ====="

          cython --version

      # 15. Final environment report
      - name: 18 - Final Environment Report
        run: |
          set -eux

          echo "===================================="
          echo "FINAL DIAGNOSTIC REPORT"
          echo "===================================="

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "PYTHON:"
          python --version

          echo ""
          echo "BUILDOZER:"
          buildozer --version

          echo ""
          echo "ANDROID:"
          adb version

          echo ""
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl" --version

          echo ""
          echo "===================================="
          echo "ALL DIAGNOSTIC CHECKS PASSED"
          echo "===================================="
