name: Rasta Studio APK Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "Installing required Android components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "Android SDK packages:"
          "$SDKMANAGER" --list_installed || true

      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          AIDL="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          echo "Checking:"
          echo "$AIDL"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            find "$ANDROID_HOME" -name aidl -type f -print || true
            exit 1
          fi

          "$AIDL" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0

      - name: Verify project files
        run: |
          test -f main.py
          test -f buildozer.spec

          echo "Project files:"
          ls -lah

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasta-studio-apk-proof
          path: bin/*.apk
          if-no-files-found: error
